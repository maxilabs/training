# ClusterSecretStore: één keer definiëren, door elke namespace te gebruiken.
#
# Verschil met SecretStore:
#   SecretStore        -> namespace-scoped, alleen bruikbaar in dezelfde namespace
#   ClusterSecretStore -> clusterbreed, bruikbaar vanuit elke namespace
#
# De referentie naar het auth-secret wijst hier naar de namespace waar het secret
# staat (namespace: external-secrets). Zonder dat veld zoekt ESO in de namespace
# van de ExternalSecret, en dan werkt het niet.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv
spec:
  conditions:
    # Alleen actief in namespaces met dit label. Zo kan een ClusterSecretStore niet
    # per ongeluk overal gebruikt worden: een extra grens bovenop RBAC.
    - namespaceSelector:
        matchLabels:
          secrets.maxilabs.dev/azure-kv: "true"
  provider:
    azurekv:
      vaultUrl: "https://<KV_NAME>.vault.azure.net"
      tenantId: "<TENANT_ID>"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: azure-sp-reader
          namespace: external-secrets
          key: ClientID
        clientSecret:
          name: azure-sp-reader
          namespace: external-secrets
          key: ClientSecret
