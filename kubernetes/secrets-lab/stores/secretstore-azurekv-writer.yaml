# SecretStore voor de SCHRIJF-identiteit (PushSecret, lab S-12).
#
# Twee identiteiten, twee rollen:
#   azure-sp-reader  Key Vault Secrets User      -> lezen (ExternalSecret)
#   azure-sp-writer  Key Vault Secrets Officer   -> lezen + schrijven (PushSecret)
#
# De writer wordt alleen gebruikt door PushSecret-resources. Zo kan een
# gecompromitteerde lees-identiteit niets in de vault wijzigen.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-kv-writer
  namespace: secrets-lab
spec:
  provider:
    azurekv:
      vaultUrl: "https://<KV_NAME>.vault.azure.net"
      tenantId: "<TENANT_ID>"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: azure-sp-writer
          key: ClientID
        clientSecret:
          name: azure-sp-writer
          key: ClientSecret
