# SecretStore met Azure Key Vault, service-principal met client-secret.
#
# WAAROM een SecretStore en geen ClusterSecretStore? Deze auth verwijst naar een
# Kubernetes Secret in DEZELFDE namespace als de SecretStore. Dat is de makkelijkste
# manier om te beginnen; de clusterbrede variant staat in clustersecretstore-azurekv.yaml.
#
# Dit bestand is een TEMPLATE: de waarden tussen <...> vul je in met
#   ../../scripts/kubeadm-lab/secrets.sh render
# Het resultaat (met echte tenant- en vaultwaarden) staat in git; het client-secret
# staat NIET in git maar in de Secret die het script aanmaakt.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-kv
  namespace: secrets-lab
spec:
  provider:
    azurekv:
      # De URL van je vault, zonder trailing slash: https://<naam>.vault.azure.net
      vaultUrl: "https://<KV_NAME>.vault.azure.net"
      tenantId: "<TENANT_ID>"
      authType: ServicePrincipal
      authSecretRef:
        # Beide sleutels komen uit één Secret; welke dat is, bepaalt de naam hieronder.
        clientId:
          name: azure-sp-reader
          key: ClientID
        clientSecret:
          name: azure-sp-reader
          key: ClientSecret
