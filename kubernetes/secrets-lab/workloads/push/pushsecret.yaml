# S-12 — PushSecret: van Kubernetes terug naar Azure Key Vault.
#
# Dit is de omgekeerde richting. Nuttig voor:
#   - een secret dat in het cluster is gegenereerd (bijv. een bootstrap-token)
#     en dat je veilig wilt bewaren;
#   - migratie van "secrets in een ConfigMap/Secret" naar een echte vault.
#
# Let op de rechten: dit vraagt SET/DELETE op de vault, dus een ANDERE identiteit dan
# de lezer. Daarom bestaat er een tweede SecretStore (azure-kv-writer) met de
# schrijf-service-principal. Least privilege is geen formaliteit: de lezer mag niet
# kunnen schrijven en de schrijver alleen in deze ene vault.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-app-config
  namespace: secrets-lab
spec:
  refreshInterval: 30s
  # Replace: de volledige waarde in Key Vault wordt vervangen.
  updatePolicy: Replace
  # Delete: als deze PushSecret verdwijnt, verdwijnt het secret ook uit Key Vault.
  # Voor de demo staat hij op None, zodat je niet per ongeluk je bron kwijtraakt.
  deletionPolicy: None
  secretStoreRefs:
    - name: azure-kv-writer
      kind: SecretStore
  selector:
    secret:
      name: push-source
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: pushed-token
