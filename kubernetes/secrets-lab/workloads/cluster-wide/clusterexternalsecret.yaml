# S-11 — ClusterExternalSecret: één definitie, veel namespaces.
#
# De controller maakt in elke namespace die aan de selector voldoet een eigen
# ExternalSecret aan (met dezelfde naam). Nieuwe namespace met het label? Dan komt
# de ExternalSecret daar automatisch bij.
#
# Dit is de reden dat je voor team-namespaces geen N losse ExternalSecrets in git zet.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: team-shared-config
spec:
  # Namespaces die dit label hebben krijgen een ExternalSecret.
  namespaceSelector:
    matchLabels:
      secrets.maxilabs.dev/team: "true"
  # Hoe vaak de controller de namespace-lijst opnieuw bekijkt.
  refreshTime: 1m
  externalSecretName: team-shared-config
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: azure-kv
      kind: ClusterSecretStore
    target:
      name: team-shared-config
      creationPolicy: Owner
      deletionPolicy: Retain
    dataFrom:
      - extract:
          key: app-config
