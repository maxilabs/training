# De demo-app: hij leest zijn configuratie uit een Kubernetes Secret dat door ESO
# wordt gevuld. De app print nooit de waarde, alleen of hij er is en hoe lang hij is.
# Dat is precies de gewoonte die je wilt aanleren: nooit een secret loggen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  namespace: secrets-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              KEYS = ["DATABASE_URL", "API_KEY", "SMTP_PASSWORD"]
              # 'optional' secrets komen binnen als ze bestaan; ontbrekende sleutels
              # laten we expliciet zien in plaats van de app te laten crashen.
              state = {k: (len(os.environ[k]) if k in os.environ else None) for k in KEYS}

              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = ["<h1>secrets-demo</h1>", "<ul>"]
                      for k, v in state.items():
                          body.append(
                              f"<li><code>{k}</code>: "
                              + (f"aanwezig ({v} tekens)" if v else "ONTBREEKT")
                              + "</li>"
                          )
                      body.append("</ul><p>De waarden zelf worden nooit getoond of gelogd.</p>")
                      out = "".join(body).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html; charset=utf-8")
                      self.send_header("Content-Length", str(len(out)))
                      self.end_headers()
                      self.wfile.write(out)

                  def log_message(self, *args):
                      pass

              print("geladen sleutels:", {k: (v if v else "ontbreekt") for k, v in state.items()}, flush=True)
              HTTPServer(("0.0.0.0", 8080), H).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Alle sleutels uit dit Secret worden environment variables.
            # We gebruiken het GERENDERDE secret (03-template.yaml): daar staan de
            # namen in die de app verwacht (DATABASE_URL, API_KEY, SMTP_PASSWORD).
            # Bij het ruwe 'app-config' heten ze api_key/smtp_password en dan zoekt
            # je app naar namen die niet bestaan - een klassieke valkuil.
            # Bestaat het Secret (nog) niet, dan start de Pod niet:
            # CreateContainerConfigError. Dat is lab S-05.
            - secretRef:
                name: app-config-templated
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: secrets-demo
  namespace: secrets-lab
spec:
  selector:
    app: secrets-demo
  ports:
    - name: http
      port: 80
      targetPort: http
