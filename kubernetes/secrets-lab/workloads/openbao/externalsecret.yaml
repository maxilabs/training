# S-17 — dezelfde ExternalSecret, maar uit OpenBao in plaats van Azure Key Vault.
# Vergelijk dit bestand met demos/02-datafrom-extract.yaml: alleen secretStoreRef
# en het pad verschillen. Dat is het punt: ESO abstraheert de vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-demo
  namespace: secrets-lab
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: openbao-demo
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: demo
