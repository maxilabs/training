# S-17 — SecretStore voor OpenBao/Vault.
#
# De auth is hier een token (dev-root-token). In productie gebruik je
# Kubernetes-auth of AppRole, met een korte lease en een policy die alleen het
# benodigde pad leest. Dat verschil is precies de les van dit lab.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: secrets-lab
spec:
  provider:
    vault:
      server: http://openbao.secrets-lab.svc:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-token
          key: token
