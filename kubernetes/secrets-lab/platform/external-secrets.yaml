# External Secrets Operator (ESO) — geïnstalleerd door Argo CD.
#
# Argo CD rendert de Helm-chart zelf; er is dus geen helm-binary op de node nodig.
# Let op de twee syncOptions:
#   ServerSideApply=true  -> de CRD's van ESO zijn te groot voor een client-side apply
#   SkipDryRunOnMissingResource=true -> een Application die zelf CRD's meebrengt faalt
#     anders op de droge run ("no matches for kind")
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        replicaCount: 1
        # Klein houden: dit lab draait op 3 VM's van 4 GiB.
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        webhook:
          replicaCount: 1
        certController:
          replicaCount: 1
        # Metrics aan, zodat lab S-19 (monitoring) iets te bekijken heeft.
        metrics:
          service:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
