# De ontvanger voor notificaties. Golf -5: moet er staan voordat er iets misgaat.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo-receiver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: https://github.com/maxilabs/training.git
    targetRevision: main
    path: kubernetes/gitops-lab/workloads/echo
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
