# Sync waves en hooks. De namespace staat in de manifests zelf, dus geen CreateNamespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: waves
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: https://github.com/maxilabs/training.git
    targetRevision: main
    path: kubernetes/gitops-lab/workloads/waves
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-waves
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
