# Optioneel: CRD + CR om een eigen health-check (Lua) te leren.
# Vereist eerst: ./argocd.sh health-crd enable
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: health-crd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: https://github.com/maxilabs/training.git
    targetRevision: main
    path: kubernetes/gitops-lab/workloads/health-crd
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-health
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
