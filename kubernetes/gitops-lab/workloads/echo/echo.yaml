# Ontvanger voor Argo CD-notificaties: logt elke POST en antwoordt 200.
# Zo zie je een melding zonder SMTP-server of Slack-workspace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: lab-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", 0))
                      body = self.rfile.read(length).decode("utf-8", "replace")
                      print("NOTIFY", body, flush=True)
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.end_headers()
                      self.wfile.write(b"ok")

                  def log_message(self, *args):
                      pass

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: lab-observability
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 8080
      targetPort: http
