# Alleen bij een mislukte sync. Handig voor meldingen of opruimacties.
apiVersion: batch/v1
kind: Job
metadata:
  name: fail-syncfail
  namespace: lab-waves-fail
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.37
          command: ["sh", "-c", "echo 'SyncFail: de sync is mislukt, workloads ongewijzigd'"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
