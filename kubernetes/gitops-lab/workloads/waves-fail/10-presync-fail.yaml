# Deze PreSync-hook faalt met opzet (exit 1).
# Gevolg: de sync stopt, de workloads worden niet aangeraakt en de SyncFail-hook draait.
apiVersion: batch/v1
kind: Job
metadata:
  name: fail-presync
  namespace: lab-waves-fail
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: fail
          image: busybox:1.37
          command: ["sh", "-c", "echo 'PreSync faalt met opzet'; exit 1"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
