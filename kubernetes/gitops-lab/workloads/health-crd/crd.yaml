# Een eigen CRD, zodat we Argo CD een aangepaste health-check kunnen leren (via ./argocd.sh health-crd).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.labs.maxilabs.dev
spec:
  group: labs.maxilabs.dev
  scope: Namespaced
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                  enum: [small, medium, large]
              required: [size]
            status:
              type: object
              properties:
                ready:
                  type: boolean
