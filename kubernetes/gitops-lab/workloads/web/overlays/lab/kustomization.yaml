apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web-lab
resources:
  - ../../base
labels:
  - pairs:
      env: lab
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
configMapGenerator:
  - name: web-html
    behavior: replace
    files:
      - index.html
