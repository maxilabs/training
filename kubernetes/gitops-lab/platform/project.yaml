# AppProject 'lab': de grens van wat de lab-apps mogen.
# Alles wat hier niet in staat, weigert Argo CD — ook als het in git staat.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab
  namespace: argocd
spec:
  description: GitOps-lab (CKA-training)

  # Alleen uit deze repo mag gesynct worden. Een Application met een andere repoURL faalt.
  sourceRepos:
    - https://github.com/maxilabs/training.git
    # Helm-repo's die als chart-bron gebruikt worden door platform-Apps.
    - https://charts.external-secrets.io
    - https://openbao.github.io/openbao-helm

  # Waar de apps mogen landen. Namespace-patronen met * zijn toegestaan.
  # 'lab-external' bestaat pas nadat je hem met ./argocd.sh cluster add hebt geregistreerd.
  destinations:
    - name: lab-external
      namespace: multi-lab
    # Platform-namespaces met een eigen leven (blok 9: secret management).
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: secrets-lab
    - server: https://kubernetes.default.svc
      namespace: secrets-team-*
    - server: https://kubernetes.default.svc
      namespace: web-*
    - server: https://kubernetes.default.svc
      namespace: guests-*
    - server: https://kubernetes.default.svc
      namespace: lab-*
    - server: https://kubernetes.default.svc
      namespace: helm-demo

  # Namespaces en CRD's zijn cluster-scoped: zonder deze whitelist werkt CreateNamespace=true
  # niet en kan de health-crd-lab zijn eigen CRD niet aanmaken.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    # Een operator zoals ESO heeft clusterbrede RBAC en een webhook nodig.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

  # Voorbeeld van een blacklist: deze apps mogen geen ResourceQuota maken.
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota

  # Waarschuw in de UI als er resources in de namespace staan die niet in git staan.
  orphanedResources:
    warn: true

  # Sync-venster: elke nacht 03:00-04:00 geen sync (onderhoud).
  # manualSync: false betekent: óók een handmatige sync wordt geweigerd.
  # Zet in de lab-opdracht de schedule tijdelijk op "* * * * *" om de weigering te zien.
  syncWindows:
    - kind: deny
      schedule: "0 3 * * *"
      duration: 1h
      timeZone: Europe/Amsterdam
      applications:
        - "*"
      manualSync: false
      clusters:
        - "*"
      namespaces:
        - "*"
